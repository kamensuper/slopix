name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same packages and Rust toolchain as the repository Dockerfile.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential grub-common grub-pc-bin \
            xorriso qemu-system-x86 python3 python3-pil python3-numpy dosfstools mtools
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1

      - name: Build kernel, ISO and SDK apps
        run: |
          mkdir -p ci-logs
          make -j"$(nproc)" 2>&1 | tee ci-logs/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: libc host test
        if: always()
        run: make libc-host-test

      - name: SlopDE host tests
        if: always()
        run: make slopde-test

      - name: Kernel runtime host test
        if: always()
        run: make runtime-test-plain

      - name: SDK check (apps with -Werror, SlopUI host test)
        if: always()
        run: make -C sdk check

      - name: Headless QEMU boot
        if: always()
        run: python3 tests/ci_boot.py --timeout 240

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopix-ci-logs
          path: |
            ci-logs/
            build/*.log
          if-no-files-found: ignore
